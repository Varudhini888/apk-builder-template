name: Build APK

on:
  repository_dispatch:
    types: [build-apk-chunk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Append Chunk Payload
        env:
          BUILD_ID: ${{ github.event.client_payload.build_id }}
          CHUNK_INDEX: ${{ github.event.client_payload.chunk_index }}
          TOTAL_CHUNKS: ${{ github.event.client_payload.total_chunks }}
          CHUNK_PAYLOAD: ${{ github.event.client_payload.chunk_payload }}
        run: |
          mkdir -p chunks
          echo "$CHUNK_PAYLOAD" > "chunks/chunk_$CHUNK_INDEX.txt"
          
          # Check if all chunks have arrived
          CURRENT_COUNT=$(ls chunks/chunk_*.txt | wc -l)
          echo "Received chunk $((CHUNK_INDEX + 1)) of $TOTAL_CHUNKS"

      - name: Assemble and Build APK
        env:
          APP_ID: ${{ github.event.client_payload.app_id }}
          APP_NAME: ${{ github.event.client_payload.app_name }}
          TOTAL_CHUNKS: ${{ github.event.client_payload.total_chunks }}
        run: |
          # Wait until all chunks are present
          for i in {1..30}; do
            CURRENT_COUNT=$(ls chunks/chunk_*.txt 2>/dev/null | wc -l)
            if [ "$CURRENT_COUNT" -eq "$TOTAL_CHUNKS" ]; then
              break
            fi
            sleep 2
          done

          echo "Assembling HTML chunks..."
          touch combined_payload.b64
          for ((i=0; i<TOTAL_CHUNKS; i++)); do
            cat "chunks/chunk_$i.txt" >> combined_payload.b64
          done

          npx -y @capacitor/cli create my-app "$APP_ID" --web-dir www --template none
          cd my-app
          
          base64 --decode ../combined_payload.b64 > www/index.html
          
          npx cap update android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: my-app/android/app/build/outputs/apk/debug/app-debug.apk
